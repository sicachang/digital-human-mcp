<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>示範 CRM 平台</title>
<style>
  body { margin:0; font-family:"Noto Sans CJK TC","WenQuanYi Zen Hei",sans-serif; background:#f4f6f9; color:#222; }
  .center { display:flex; align-items:center; justify-content:center; height:100vh; }
  .card { background:#fff; padding:32px 36px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); width:360px; }
  label { display:block; margin:14px 0 6px; font-size:14px; color:#555; }
  input, select, textarea { width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid #ccd; border-radius:6px; font-size:15px; }
  button { margin-top:18px; padding:10px 18px; border:0; border-radius:6px; background:#1565c0; color:#fff; font-size:15px; cursor:pointer; }
  .layout { display:flex; height:100vh; }
  nav { width:200px; background:#1e293b; color:#fff; padding:20px 0; }
  nav a { display:block; color:#cbd5e1; padding:10px 22px; text-decoration:none; }
  nav a.active, nav a:hover { background:#334155; color:#fff; }
  main { flex:1; padding:28px 36px; overflow:auto; }
  table { border-collapse:collapse; width:100%; background:#fff; margin-top:16px; }
  td, th { border-bottom:1px solid #e5e7eb; padding:10px; text-align:left; }
  .toast { position:fixed; top:20px; right:20px; background:#2e7d32; color:#fff; padding:12px 18px; border-radius:8px; }
  .error { color:#c62828; font-size:14px; margin-top:8px; }
  .form { max-width:520px; background:#fff; padding:20px 24px; border-radius:10px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div id="login" class="center">
  <div class="card">
    <h2>登入示範 CRM</h2>
    <label for="acc">帳號</label><input id="acc" name="account" placeholder="請輸入帳號">
    <label for="pwd">密碼</label><input id="pwd" name="password" type="password" placeholder="請輸入密碼">
    <div id="loginErr" class="error"></div>
    <button id="loginBtn" type="submit">登入</button>
  </div>
</div>
<div id="app" class="layout hidden">
  <nav>
    <div style="padding:0 22px 16px;font-weight:700">示範 CRM</div>
    <a href="#/dashboard" data-page="dashboard" class="active">首頁</a>
    <a href="#/customers" data-page="customers">客戶管理</a>
    <a href="#/reports" data-page="reports">報表</a>
  </nav>
  <main>
    <section id="dashboard"><h1>首頁</h1><p>歡迎回來！本月新增客戶 <b id="count">2</b> 位。</p></section>
    <section id="customers" class="hidden">
      <h1>客戶管理</h1>
      <button id="addBtn" data-testid="add-customer">新增客戶</button>
      <div id="form" class="form hidden" style="margin-top:16px">
        <label for="cname">客戶名稱</label><input id="cname" placeholder="例如：台灣科技股份有限公司">
        <label for="phone">聯絡電話</label><input id="phone" placeholder="02-1234-5678">
        <label for="cat">客戶等級</label>
        <select id="cat"><option>一般</option><option>重要</option><option>VIP</option></select>
        <label for="note">備註</label><textarea id="note" rows="2"></textarea>
        <div id="formErr" class="error"></div>
        <button id="saveBtn">儲存</button>
      </div>
      <table><thead><tr><th>客戶名稱</th><th>電話</th><th>等級</th></tr></thead>
        <tbody id="rows"><tr><td>大同貿易</td><td>02-2222-3333</td><td>一般</td></tr><tr><td>光明電子</td><td>03-555-6666</td><td>重要</td></tr></tbody></table>
    </section>
    <section id="reports" class="hidden"><h1>報表</h1><p>報表功能建置中。</p></section>
  </main>
</div>
<script>
const $ = (s) => document.querySelector(s);
function show(page) {
  document.querySelectorAll("main section").forEach(s => s.classList.add("hidden"));
  $("#" + page).classList.remove("hidden");
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("active", a.dataset.page === page));
}
function route() { if (sessionStorage.getItem("auth")) { $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); show((location.hash.split("/")[1]) || "dashboard"); } }
window.addEventListener("hashchange", route);
$("#loginBtn").onclick = () => {
  if ($("#acc").value === "demo" && $("#pwd").value === "demo123") { sessionStorage.setItem("auth", "1"); location.hash = "#/dashboard"; route(); }
  else $("#loginErr").textContent = "帳號或密碼錯誤";
};
$("#addBtn").onclick = () => $("#form").classList.toggle("hidden");
$("#saveBtn").onclick = () => {
  const n = $("#cname").value.trim();
  if (!n) { $("#formErr").textContent = "請輸入客戶名稱"; return; }
  $("#formErr").textContent = "";
  const tr = document.createElement("tr");
  tr.innerHTML = `<td>${n}</td><td>${$("#phone").value}</td><td>${$("#cat").value}</td>`;
  $("#rows").prepend(tr); $("#form").classList.add("hidden");
  $("#count").textContent = +$("#count").textContent + 1;
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = "客戶已新增成功";
  document.body.appendChild(t); setTimeout(() => t.remove(), 4000);
};
route();
</script>
</body>
</html>
